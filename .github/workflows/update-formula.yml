name: Update formula on new upstream release

# Polls the upstream Pentest-Swarm-AI repo for a newer GitHub Release than
# what the current formula points at. If found:
#   1. Downloads each platform binary
#   2. Computes its SHA256
#   3. Rewrites Formula/pentestswarm.rb to match the binary-release shape
#      from deploy/homebrew/pentestswarm.rb.template upstream
#   4. Commits + pushes the updated formula
#
# Triggers:
#   - workflow_dispatch (manual run from the Actions UI — useful right
#     after a tag is pushed upstream so you don't wait for the cron)
#   - schedule (every 6h) — catches releases the dispatch missed
#   - repository_dispatch type 'upstream-release' — wired from the
#     upstream release.yml as an immediate notification path
#
# Auth: only needs the default GITHUB_TOKEN (write contents on this repo).
# No PAT required because the workflow runs inside homebrew-tap itself.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Fetch latest upstream release
        id: upstream
        run: |
          set -eu
          rel=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Armur-Ai/Pentest-Swarm-AI/releases/latest")
          tag=$(echo "$rel" | jq -r .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "no upstream release yet"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream-tag=$tag"

      - name: Skip if formula already up to date
        if: steps.upstream.outputs.skip != 'true'
        id: check
        run: |
          set -eu
          current=$(awk -F'"' '/^  version /{print $2}' Formula/pentestswarm.rb)
          new="${{ steps.upstream.outputs.version }}"
          if [ "$current" = "$new" ]; then
            echo "formula already at $current — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "updating $current -> $new"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artefacts and compute SHAs
        if: steps.check.outputs.skip != 'true'
        id: shas
        run: |
          set -eu
          tag="${{ steps.upstream.outputs.tag }}"
          base="https://github.com/Armur-Ai/Pentest-Swarm-AI/releases/download/$tag"
          mkdir -p _dl
          for asset in pentestswarm-darwin-arm64 pentestswarm-darwin-amd64 \
                       pentestswarm-linux-arm64  pentestswarm-linux-amd64; do
            curl -sSfL "$base/$asset" -o "_dl/$asset"
          done
          {
            echo "darwin_arm64=$(sha256sum _dl/pentestswarm-darwin-arm64 | awk '{print $1}')"
            echo "darwin_amd64=$(sha256sum _dl/pentestswarm-darwin-amd64 | awk '{print $1}')"
            echo "linux_arm64=$(sha256sum  _dl/pentestswarm-linux-arm64  | awk '{print $1}')"
            echo "linux_amd64=$(sha256sum  _dl/pentestswarm-linux-amd64  | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Render new formula
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          version="${{ steps.upstream.outputs.version }}"
          tag="${{ steps.upstream.outputs.tag }}"
          cat > Formula/pentestswarm.rb <<EOF
          # Auto-generated by .github/workflows/update-formula.yml.
          # Manual edits will be overwritten on the next upstream release.
          #
          # Install with:
          #   brew install Armur-Ai/tap/pentestswarm

          class Pentestswarm < Formula
            desc "Swarm of AI agents for authorized penetration testing"
            homepage "https://github.com/Armur-Ai/Pentest-Swarm-AI"
            version "${version}"
            license "AGPL-3.0-only"

            on_macos do
              on_arm do
                url "https://github.com/Armur-Ai/Pentest-Swarm-AI/releases/download/${tag}/pentestswarm-darwin-arm64"
                sha256 "${{ steps.shas.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "https://github.com/Armur-Ai/Pentest-Swarm-AI/releases/download/${tag}/pentestswarm-darwin-amd64"
                sha256 "${{ steps.shas.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Armur-Ai/Pentest-Swarm-AI/releases/download/${tag}/pentestswarm-linux-arm64"
                sha256 "${{ steps.shas.outputs.linux_arm64 }}"
              end
              on_intel do
                url "https://github.com/Armur-Ai/Pentest-Swarm-AI/releases/download/${tag}/pentestswarm-linux-amd64"
                sha256 "${{ steps.shas.outputs.linux_amd64 }}"
              end
            end

            def install
              binary = Dir["pentestswarm-*"].first
              bin.install binary => "pentestswarm"
            end

            def caveats
              <<~EOS
                First-time setup:
                  pentestswarm init
                  pentestswarm scan example.com

                Optional security tools the swarm calls out to:
                  brew install nmap sqlmap gobuster semgrep trufflehog gitleaks

                Config + state directory:
                  ~/.pentestswarm/   (config.yaml, fp-cache.jsonl, findings.db)
                \`brew uninstall\` does NOT remove this directory. Remove it
                manually with \`rm -rf ~/.pentestswarm\` if you want a clean slate.

                Or run the bundled Docker image (all 16 tools pre-installed):
                  docker run --rm -e PENTESTSWARM_ORCHESTRATOR_API_KEY=\$KEY \\\\
                    ghcr.io/armur-ai/pentestswarm:latest scan example.com
              EOS
            end

            test do
              assert_match "pentestswarm version", shell_output("#{bin}/pentestswarm --version")
            end
          end
          EOF

      - name: Commit + push
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          git config user.name  "homebrew-tap-bot"
          git config user.email "actions@github.com"
          git add Formula/pentestswarm.rb
          git commit -m "chore: bump pentestswarm to ${{ steps.upstream.outputs.tag }}"
          git push
